name: README check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so link rot shows up even while the README sits unchanged.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  check:
    name: README and assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check README
        env:
          MAX_ASSET_KB: '200'
          LINK_TIMEOUT_MS: '10000'
        run: node scripts/check-readme.mjs
